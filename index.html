
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Academia de Heróis</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <header>
        <h1>Academia de Heróis</h1>
        <p>Inscreva-se para participar da próxima missão.</p>
    </header>

    <main>
        <form action="#" method="get">
            <h2>Faça sua inscrição</h2>

            <label for="nome">Nome de herói:</label>
            <input id="nome" name="nome" type="text" />

            <label for="email">Email:</label>
            <input id="email" name="email" type="email" />

            <label for="idade">Idade:</label>
            <input id="idade" name="idade" type="number" />

            <label for="equipe">Escolha sua equipe:</label>
            <select id="equipe" name="equipe">
                <option>Liga da Justiça</option>
                <option>Vingadores</option>
                <option>X-Men</option>
                <option>Guardiões da Galáxia</option>
            </select>

            <h2>Qual poder você prefere?</h2>
          <section class="opcao">
            <input id="voar" name="poder" type="radio" value="voar" />
            <label for="voar">Voar</label>
          </section>
      
         <section class="opcao">
            <input id="velocidade" name="poder" type="radio" value="velocidade" />
            <label for="velocidade">Supervelocidade</label>
          </section>
      
          <section class="opcao">
            <input id="forca" name="poder" type="radio" value="forca" />
            <label for="forca">Superforça</label>
          </section>
          
          <section class="opcao">
            <input id="novidades" name="novidades" type="checkbox" />
            <label for="novidades">Quero receber novas missões.</label>
           </section>

            <label for="descricao">Por que você quer ser um herói?</label>
            <textarea id="descricao" name="descricao" rows="4"></textarea>



            <button type="submit">Enviar inscrição</button>
        </form>
    </main>

    <footer>
            <p>Prática de formulários HTML.</p>
    </footer>

</body>
</html>
